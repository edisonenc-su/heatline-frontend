  <script src="js/app.js"></script>
  <script>
    (async () => {
      const session = Auth.requireAuth();
      if (!session) return;
      try {
        const list = await API.getControllers(session);
        if (Array.isArray(list) && list.length > 0) {
          location.href = 'detail.html?id=' + list[0].id;
          return;
        }
      } catch (e) { console.warn(e); }
      location.href = 'controllers.html';
    })();
  </script>
