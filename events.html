<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>이벤트 로그 - HEAT-LINE 통합관제</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== HEAT-LINE v2 Theme (scoped, body.v2-theme 전용) ===== */
    body.v2-theme {
      --v2-bg:#0A1120; --v2-bg-2:#111B2E; --v2-panel:#1F2B41; --v2-panel-2:#1A2235;
      --v2-border:#2A3650; --v2-text:#EEF2F8; --v2-text-dim:#C5CDDB; --v2-text-mute:#96A2B8;
      --v2-amber:#F3A73B; --v2-amber-ink:#1A1200; --v2-mint:#5BD3A6; --v2-red:#F07070;
      --bg:var(--v2-bg); --bg-dark:var(--v2-bg); --bg-secondary:var(--v2-bg-2);
      --bg-card:var(--v2-panel); --panel:var(--v2-panel); --card:var(--v2-panel); --card-bg:var(--v2-panel);
      --border:var(--v2-border); --text:var(--v2-text); --text-primary:var(--v2-text);
      --text-secondary:var(--v2-text-dim); --text-muted:var(--v2-text-mute);
      --accent:var(--v2-amber); --primary:var(--v2-amber);
      background:var(--v2-bg); color:var(--v2-text);
      font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body.v2-theme .app-layout, body.v2-theme .main-content, body.v2-theme .page-body {
      background:var(--v2-bg); color:var(--v2-text);
    }
    body.v2-theme .sidebar { background:var(--v2-bg-2); border-right:1px solid var(--v2-border); color:var(--v2-text-dim); }
    body.v2-theme .sidebar a, body.v2-theme .sidebar .nav-item { color:var(--v2-text-dim); }
    body.v2-theme .sidebar a:hover, body.v2-theme .sidebar .nav-item:hover, body.v2-theme .sidebar .nav-item.active {
      background:var(--v2-panel); color:var(--v2-amber);
    }
    body.v2-theme .app-header, body.v2-theme .header { background:var(--v2-bg-2); border-bottom:1px solid var(--v2-border); color:var(--v2-text); }
    body.v2-theme .table-section, body.v2-theme .stat-card, body.v2-theme .filter-toolbar {
      background:var(--v2-panel); border:1px solid var(--v2-border); border-radius:14px;
      color:var(--v2-text); box-shadow:0 6px 24px rgba(0,0,0,0.25);
    }
    body.v2-theme .table-header h2, body.v2-theme h1, body.v2-theme h2, body.v2-theme h3 { color:var(--v2-text); }
    body.v2-theme .table-header a { color:var(--v2-mint) !important; }
    body.v2-theme thead th { background:var(--v2-panel-2); color:var(--v2-text-mute); border-bottom:1px solid var(--v2-border); font-size:12px; letter-spacing:0.04em; }
    body.v2-theme tbody td { border-bottom:1px solid var(--v2-border); color:var(--v2-text-dim); }
    body.v2-theme tbody tr:hover { background:rgba(91,211,166,0.04); }
    body.v2-theme .log-item { border-bottom:1px solid var(--v2-border); color:var(--v2-text); }
    body.v2-theme .log-item:hover { background:rgba(91,211,166,0.05); }
    body.v2-theme .log-item .log-msg { color:var(--v2-text); }
    body.v2-theme .log-item .log-meta { color:var(--v2-text-mute); }
    body.v2-theme .form-label { display:block; font-size:13px; color:var(--v2-text-mute); margin-bottom:6px; font-weight:600; }
    body.v2-theme .form-input, body.v2-theme .form-select, body.v2-theme .form-textarea,
    body.v2-theme .form-control {
      width:100%; background:var(--v2-bg); border:1px solid var(--v2-border); color:var(--v2-text);
      border-radius:10px; padding:10px 12px; outline:none; font-size:14px;
    }
    body.v2-theme .form-input:focus, body.v2-theme .form-select:focus, body.v2-theme .form-textarea:focus,
    body.v2-theme .form-control:focus {
      border-color:var(--v2-amber); box-shadow:0 0 0 3px rgba(243,167,59,0.12);
    }
    body.v2-theme .search-box input {
      background:var(--v2-bg); border:1px solid var(--v2-border); color:var(--v2-text);
      border-radius:8px; padding:8px 10px; outline:none;
    }
    body.v2-theme .search-box input::placeholder { color:var(--v2-text-mute); }
    body.v2-theme .search-box input:focus { border-color:var(--v2-amber); }
    body.v2-theme .btn-primary { background:var(--v2-amber); color:var(--v2-amber-ink); border:none; font-weight:700; }
    body.v2-theme .btn-primary:hover { filter:brightness(1.08); }
    body.v2-theme .btn-secondary { background:var(--v2-panel-2); color:var(--v2-text-dim); border:1px solid var(--v2-border); }
    body.v2-theme .btn-secondary:hover { border-color:var(--v2-amber); color:var(--v2-amber); }
    body.v2-theme .btn-danger { background:var(--v2-red); color:#1A0A0A; border:none; font-weight:700; }
    body.v2-theme .btn-warning { background:var(--v2-amber); color:var(--v2-amber-ink); border:none; font-weight:700; }
    body.v2-theme .btn-success { background:var(--v2-mint); color:#0A1A14; border:none; font-weight:700; }
    body.v2-theme .badge { border-radius:999px; }
    body.v2-theme .badge-online { background:rgba(91,211,166,0.14); color:var(--v2-mint); border:1px solid rgba(91,211,166,0.35); }
    body.v2-theme .badge-warning { background:rgba(243,167,59,0.14); color:var(--v2-amber); border:1px solid rgba(243,167,59,0.4); }
    body.v2-theme .badge-danger { background:rgba(240,112,112,0.14); color:var(--v2-red); border:1px solid rgba(240,112,112,0.4); }
    body.v2-theme .badge-offline { background:rgba(150,162,184,0.12); color:var(--v2-text-mute); border:1px solid rgba(150,162,184,0.3); }
    body.v2-theme .modal-backdrop { background:rgba(10,17,32,0.72); }
    body.v2-theme .modal-box { background:var(--v2-panel); border:1px solid var(--v2-border); color:var(--v2-text); border-radius:14px; box-shadow:0 16px 48px rgba(0,0,0,0.4); }
    body.v2-theme .modal-header { border-bottom:1px solid var(--v2-border); }
    body.v2-theme .modal-title { color:var(--v2-text); }
    body.v2-theme .modal-close { color:var(--v2-text-mute); }
    body.v2-theme .confirm-modal { color:var(--v2-text-dim); }
    body.v2-theme .modal-footer { border-top:1px solid var(--v2-border); }
    body.v2-theme a { color:var(--v2-mint); }
    body.v2-theme code { color:var(--v2-mint); }
    body.v2-theme ::-webkit-scrollbar { width:10px; height:10px; }
    body.v2-theme ::-webkit-scrollbar-thumb { background:var(--v2-border); border-radius:8px; }
    body.v2-theme ::-webkit-scrollbar-track { background:var(--v2-bg); }
  </style>

</head>
<body class="v2-theme">
  <div id="sidebar-placeholder"></div>

  <div class="app-layout">
    <div class="main-content">
      <div id="header-placeholder"></div>

      <div class="page-body">
        <!-- 심각도별 통계 -->
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:24px" id="evt-stats"></div>

        <!-- 필터 -->
        <div class="filter-toolbar">
          <select id="filter-severity" onchange="renderTable()" style="
            background:var(--bg-dark);border:1px solid var(--border);
            border-radius:8px;padding:9px 14px;color:var(--text-primary);
            font-size:14px;outline:none;cursor:pointer;
          ">
            <option value="">전체 심각도</option>
            <option value="critical">🚨 긴급</option>
            <option value="warning">⚠️ 경고</option>
            <option value="info">ℹ️ 정보</option>
          </select>

          <select id="filter-type" onchange="renderTable()" style="
            background:var(--bg-dark);border:1px solid var(--border);
            border-radius:8px;padding:9px 14px;color:var(--text-primary);
            font-size:14px;outline:none;cursor:pointer;
          ">
            <option value="">전체 유형</option>
            <option value="SNOW_DETECTED">❄️ 눈 감지</option>
            <option value="SNOW_CLEARED">☀️ 눈 해제</option>
            <option value="HEATER_ON">🔥 히터 ON</option>
            <option value="HEATER_OFF">💧 히터 OFF</option>
            <option value="DEVICE_OFFLINE">⚫ 장비 오프라인</option>
            <option value="DEVICE_ONLINE">🟢 장비 온라인</option>
            <option value="ALARM">🚨 알람</option>
          </select>

          <button class="btn btn-secondary btn-sm" onclick="resetFilters()">초기화</button>
          <span id="result-count" class="filter-toolbar__spacer" style="font-size:13px;color:#d7e4f3"></span>
        </div>

        <!-- 이벤트 테이블 -->
        <div class="table-section has-mobile-list">
          <div class="table-header">
            <h2>🔔 이벤트 로그 전체</h2>
            <button class="btn btn-secondary btn-sm" onclick="loadAll()">🔄 새로고침</button>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>심각도</th>
                  <th>유형</th>
                  <th>제어기명</th>
                  <th id="th-customer">고객사</th>
                  <th>메시지</th>
                  <th>시간</th>
                </tr>
              </thead>
              <tbody id="evt-tbody">
                <tr><td colspan="6" style="text-align:center;padding:40px;color:#64748b">로딩 중...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="evt-mobile-list" class="mobile-record-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    let session, allEvents = [], allControllers = [], allCustomers = [];

    const evtIcons = {
      SNOW_DETECTED: '❄️', SNOW_CLEARED: '☀️',
      HEATER_ON: '🔥', HEATER_OFF: '💧',
      DEVICE_OFFLINE: '⚫', DEVICE_ONLINE: '🟢', ALARM: '🚨'
    };
    const severityColor = { info: '#10b981', warning: '#f59e0b', critical: '#ef4444' };
    const severityLabel = { info: '정보', warning: '경고', critical: '긴급' };

    async function init() {
      session = Auth.requireAuth();
      if (!session) return;

      document.getElementById('sidebar-placeholder').innerHTML = renderSidebar(session, 'events');
      document.getElementById('header-placeholder').innerHTML = renderHeader('이벤트 로그', '', []);
      startClock();

      if (session.role !== 'admin') {
        document.getElementById('th-customer').style.display = 'none';
      }

      await loadAll();
    }

    async function loadAll() {
      [allControllers, allCustomers] = await Promise.all([
        API.getControllers(session),
        API.getCustomers()
      ]);

      allEvents = await API.getEventLogs(null, 100);

      // 권한 필터
      const myCtrlIds = new Set(allControllers.map(c => c.id));
      if (session.role !== 'admin') {
        allEvents = allEvents.filter(e => myCtrlIds.has(e.controller_id));
      }

      renderStats();
      renderTable();
    }

    function renderStats() {
      const critical = allEvents.filter(e => e.severity === 'critical').length;
      const warning = allEvents.filter(e => e.severity === 'warning').length;
      const info = allEvents.filter(e => e.severity === 'info').length;

      document.getElementById('evt-stats').innerHTML = `
        <div class="stat-card danger">
          <div class="stat-icon">🚨</div>
          <div class="stat-value">${critical}</div>
          <div class="stat-label">긴급 이벤트</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">⚠️</div>
          <div class="stat-value">${warning}</div>
          <div class="stat-label">경고 이벤트</div>
        </div>
        <div class="stat-card online">
          <div class="stat-icon">ℹ️</div>
          <div class="stat-value">${info}</div>
          <div class="stat-label">정보 이벤트</div>
        </div>
        <div class="stat-card total">
          <div class="stat-icon">📊</div>
          <div class="stat-value">${allEvents.length}</div>
          <div class="stat-label">전체 이벤트</div>
        </div>
      `;
    }

    function renderTable() {
      const severity = document.getElementById('filter-severity').value;
      const type = document.getElementById('filter-type').value;
      const isAdmin = session.role === 'admin';

      const ctrlMap = {}, custMap = {};
      allControllers.forEach(c => ctrlMap[c.id] = c);
      allCustomers.forEach(c => custMap[c.id] = c);

      let filtered = allEvents.filter(e => {
        if (severity && e.severity !== severity) return false;
        if (type && e.event_type !== type) return false;
        return true;
      });

      document.getElementById('result-count').textContent = `${filtered.length}건`;

      const tbody = document.getElementById('evt-tbody');

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}" style="text-align:center;padding:30px;color:#64748b">이벤트 없음</td></tr>`;
        return;
      }

      renderMobileList(filtered, ctrlMap, custMap, isAdmin);

      tbody.innerHTML = filtered.map(evt => {
        const ctrl = ctrlMap[evt.controller_id];
        const cust = ctrl ? custMap[ctrl.customer_id] : null;

        return `
          <tr onclick="location.href='detail.html?id=${evt.controller_id}'" style="cursor:pointer">
            <td>
              <span class="badge" style="
                background:${severityColor[evt.severity] || '#94a3b8'}20;
                color:${severityColor[evt.severity] || '#94a3b8'};
                border:1px solid ${severityColor[evt.severity] || '#94a3b8'}40;
              ">
                ${evt.severity === 'critical' ? '🚨 긴급' : evt.severity === 'warning' ? '⚠️ 경고' : 'ℹ️ 정보'}
              </span>
            </td>
            <td>
              <span style="display:inline-flex;align-items:center;gap:5px;font-size:13px">
                ${evtIcons[evt.event_type] || '📌'} ${evt.event_type}
              </span>
            </td>
            <td>
              <div style="font-weight:600;font-size:14px">${ctrl ? ctrl.controller_name : '-'}</div>
            </td>
            ${isAdmin ? `<td style="font-size:13px;color:#94a3b8">${cust ? cust.company_name : '-'}</td>` : ''}
            <td style="font-size:13px">${evt.message || '-'}</td>
            <td style="font-size:12px;color:#64748b;white-space:nowrap">${Utils.timeAgo(evt.updated_at || evt.created_at)}</td>
          </tr>
        `;
      }).join('');
    }



    function renderMobileList(filtered, ctrlMap, custMap, isAdmin) {
      const container = document.getElementById('evt-mobile-list');
      if (!container) return;
      if (filtered.length === 0) {
        container.innerHTML = `<div class="mobile-record-card"><div class="mobile-record-card__title">이벤트 없음</div><div class="mobile-record-card__sub">조건에 맞는 이벤트가 없습니다.</div></div>`;
        return;
      }
      container.innerHTML = filtered.map(evt => {
        const ctrl = ctrlMap[evt.controller_id];
        const cust = ctrl ? custMap[ctrl.customer_id] : null;
        const sevColor = severityColor[evt.severity] || '#d7e4f3';
        return `
          <div class="mobile-record-card" onclick="location.href='detail.html?id=${evt.controller_id}'">
            <div class="mobile-record-card__top">
              <div>
                <div class="mobile-record-card__title">${evtIcons[evt.event_type] || '📌'} ${evt.event_type}</div>
                <div class="mobile-record-card__sub">${ctrl ? ctrl.controller_name : '-'}${isAdmin && cust ? ` · ${cust.company_name}` : ''}</div>
              </div>
              <span class="badge" style="background:${sevColor}20;color:${sevColor};border:1px solid ${sevColor}50">${severityLabel[evt.severity] || evt.severity}</span>
            </div>
            <div class="mobile-record-item"><div class="label">메시지</div><div class="value">${evt.message || '-'}</div></div>
            <div class="mobile-record-card__sub" style="margin-top:12px">${Utils.timeAgo(evt.updated_at || evt.created_at)}</div>
          </div>
        `;
      }).join('');
    }

    function resetFilters() {
      document.getElementById('filter-severity').value = '';
      document.getElementById('filter-type').value = '';
      renderTable();
    }

    init();
  </script>
</body>
</html>
