<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A1120">
  <title>제어·이벤트 이력 - HEAT-LINE 통합관제</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.v2-theme {
      --v2-bg:#0A1120; --v2-bg-2:#111B2E; --v2-panel:#1F2B41; --v2-panel-2:#1A2235;
      --v2-border:#2A3650; --v2-text:#EEF2F8; --v2-text-dim:#C5CDDB; --v2-text-mute:#96A2B8;
      --v2-amber:#F3A73B; --v2-amber-ink:#1A1200; --v2-mint:#5BD3A6; --v2-red:#F07070;
      --bg:var(--v2-bg); --bg-card:var(--v2-panel); --border:var(--v2-border);
      --text:var(--v2-text); --text-primary:var(--v2-text); --text-secondary:var(--v2-text-dim); --text-muted:var(--v2-text-mute);
      background:var(--v2-bg); color:var(--v2-text);
      font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body.v2-theme .app-layout, body.v2-theme .main-content, body.v2-theme .page-body { background:var(--v2-bg); color:var(--v2-text); }
    .ch-tabs { display:flex; gap:6px; margin-bottom:18px; }
    .ch-tabs button {
      padding:9px 18px; border-radius:999px; border:1px solid var(--v2-border);
      background:var(--v2-panel-2); color:var(--v2-text-mute);
      font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s;
    }
    .ch-tabs button:hover { color:var(--v2-text); border-color:var(--v2-amber); }
    .ch-tabs button.active { background:var(--v2-amber); color:var(--v2-amber-ink); border-color:var(--v2-amber); }
    .ch-card {
      background:var(--v2-panel); border:1px solid var(--v2-border); border-radius:14px;
      box-shadow:0 6px 24px rgba(0,0,0,0.25); overflow:hidden;
    }
    .ch-card-head {
      display:flex; justify-content:space-between; align-items:center;
      padding:16px 20px; border-bottom:1px solid var(--v2-border);
    }
    .ch-card-head h2 { margin:0; font-size:16px; color:var(--v2-text); }
    .ch-card-head .cnt { font-size:12.5px; color:var(--v2-text-mute); }
    .ch-table { width:100%; border-collapse:collapse; }
    .ch-table th {
      background:var(--v2-panel-2); color:var(--v2-text-mute); font-size:12px; letter-spacing:.04em;
      text-align:left; padding:12px 16px; border-bottom:1px solid var(--v2-border);
    }
    .ch-table td { padding:12px 16px; border-bottom:1px solid var(--v2-border); color:var(--v2-text-dim); font-size:13px; }
    .ch-table tr:last-child td { border-bottom:none; }
    .ch-table tr:hover td { background:rgba(91,211,166,0.04); }
    .ch-table .t-time { color:var(--v2-text-mute); font-size:12px; white-space:nowrap; }
    .ch-table .t-name { color:var(--v2-text); font-weight:600; }
    .ch-pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
    .ch-pill.ok { background:rgba(91,211,166,0.14); color:var(--v2-mint); border:1px solid rgba(91,211,166,0.35); }
    .ch-pill.warn { background:rgba(243,167,59,0.14); color:var(--v2-amber); border:1px solid rgba(243,167,59,0.4); }
    .ch-pill.err { background:rgba(240,112,112,0.14); color:var(--v2-red); border:1px solid rgba(240,112,112,0.4); }
    .ch-pill.dim { background:rgba(150,162,184,0.12); color:var(--v2-text-mute); border:1px solid rgba(150,162,184,0.3); }
    .ch-empty { padding:44px 20px; text-align:center; color:var(--v2-text-mute); font-size:14px; }
    .ch-refresh {
      background:var(--v2-panel-2); border:1px solid var(--v2-border); color:var(--v2-text-dim);
      border-radius:8px; padding:7px 12px; font-size:12.5px; cursor:pointer; font-family:inherit;
    }
    .ch-refresh:hover { border-color:var(--v2-amber); color:var(--v2-amber); }
    .ch-body { overflow-x:auto; }
    @media (max-width:640px){ .ch-table th:nth-child(4), .ch-table td:nth-child(4){ display:none; } }
  </style>
</head>
<body class="v2-theme">
  <div id="sidebar-placeholder"></div>

  <div class="app-layout">
    <div class="main-content">
      <div id="header-placeholder"></div>

      <div class="page-body">
        <div class="ch-tabs">
          <button id="tab-control" class="active" onclick="switchTab('control')">🎛️ 제어 로그</button>
          <button id="tab-event" onclick="switchTab('event')">🔔 이벤트</button>
        </div>

        <!-- 제어 로그 -->
        <div class="ch-card" id="card-control">
          <div class="ch-card-head">
            <h2>제어 로그 <span class="cnt" id="control-count"></span></h2>
            <button class="ch-refresh" onclick="loadControlLogs()">🔄 새로고침</button>
          </div>
          <div class="ch-body">
            <table class="ch-table">
              <thead>
                <tr><th>시간</th><th>장비</th><th>명령</th><th>값</th><th>결과</th><th>요청자</th></tr>
              </thead>
              <tbody id="control-tbody">
                <tr><td colspan="6" class="ch-empty">로딩 중...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 이벤트 -->
        <div class="ch-card" id="card-event" style="display:none;">
          <div class="ch-card-head">
            <h2>이벤트 <span class="cnt" id="event-count"></span></h2>
            <button class="ch-refresh" onclick="loadEvents()">🔄 새로고침</button>
          </div>
          <div class="ch-body">
            <table class="ch-table">
              <thead>
                <tr><th>시간</th><th>장비</th><th>분류</th><th>심각도</th><th>내용</th></tr>
              </thead>
              <tbody id="event-tbody">
                <tr><td colspan="5" class="ch-empty">로딩 중...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    let session = null;

    function esc(s){ return (window.escapeHtml ? escapeHtml(String(s ?? '-')) : String(s ?? '-')); }
    function fmtTime(v){
      try {
        const d = new Date(v);
        if (isNaN(d)) return '-';
        return d.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
      } catch(_) { return '-'; }
    }
    function resultPill(r){
      const v = String(r || '').toLowerCase();
      if (['success','ok','done','완료'].includes(v)) return '<span class="ch-pill ok">성공</span>';
      if (['failed','fail','error','실패'].includes(v)) return '<span class="ch-pill err">실패</span>';
      if (['pending','queued','processing'].includes(v)) return '<span class="ch-pill warn">대기</span>';
      return '<span class="ch-pill dim">' + esc(r || '-') + '</span>';
    }
    function severityPill(s){
      const v = String(s || 'info').toLowerCase();
      if (v === 'critical' || v === 'error') return '<span class="ch-pill err">' + esc(s) + '</span>';
      if (v === 'warning') return '<span class="ch-pill warn">' + esc(s) + '</span>';
      return '<span class="ch-pill ok">' + esc(s || 'info') + '</span>';
    }

    function switchTab(which){
      const isControl = which === 'control';
      document.getElementById('tab-control').classList.toggle('active', isControl);
      document.getElementById('tab-event').classList.toggle('active', !isControl);
      document.getElementById('card-control').style.display = isControl ? '' : 'none';
      document.getElementById('card-event').style.display = isControl ? 'none' : '';
    }

    async function loadControlLogs(){
      const tbody = document.getElementById('control-tbody');
      try {
        if (!window.API || typeof API.getControlLogs !== 'function') {
          tbody.innerHTML = '<tr><td colspan="6" class="ch-empty">제어 로그 API를 사용할 수 없습니다.</td></tr>';
          return;
        }
        const res = await API.getControlLogs(session, 50);
        const items = Array.isArray(res) ? res : (res.items || res.data || []);
        document.getElementById('control-count').textContent = items.length + '건';
        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="ch-empty">제어 로그가 없습니다.</td></tr>';
          return;
        }
        tbody.innerHTML = items.map(l => `
          <tr>
            <td class="t-time">${fmtTime(l.created_at || l.requested_at || l.finished_at)}</td>
            <td class="t-name">${esc(l.controller_name || l.controller_id)}</td>
            <td>${esc(l.command_type)}</td>
            <td>${esc(l.command_value)}</td>
            <td>${resultPill(l.result || l.status)}</td>
            <td>${esc(l.user_name || l.requested_by || '-')}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" class="ch-empty">조회 실패: ' + esc(e.message) + '</td></tr>';
      }
    }

    async function loadEvents(){
      const tbody = document.getElementById('event-tbody');
      try {
        if (!window.API || typeof API.getEventLogs !== 'function') {
          tbody.innerHTML = '<tr><td colspan="5" class="ch-empty">이벤트 API를 사용할 수 없습니다.</td></tr>';
          return;
        }
        const res = await API.getEventLogs(null, 50);
        const items = Array.isArray(res) ? res : (res.items || res.data || []);
        document.getElementById('event-count').textContent = items.length + '건';
        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="ch-empty">이벤트가 없습니다.</td></tr>';
          return;
        }
        tbody.innerHTML = items.map(ev => `
          <tr>
            <td class="t-time">${fmtTime(ev.occurred_at || ev.created_at)}</td>
            <td class="t-name">${esc(ev.controller_name || ev.controller_id)}</td>
            <td>${esc(ev.event_type)}</td>
            <td>${severityPill(ev.severity)}</td>
            <td>${esc(ev.message)}</td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" class="ch-empty">조회 실패: ' + esc(e.message) + '</td></tr>';
      }
    }

    async function init(){
      session = Auth.requireAuth();
      if (!session) return;
      document.getElementById('sidebar-placeholder').innerHTML = renderSidebar(session, 'history');
      document.getElementById('header-placeholder').innerHTML = renderHeader('제어·이벤트 이력', '제어 로그와 이벤트를 한 곳에서 확인', []);
      startClock();
      await Promise.all([loadControlLogs(), loadEvents()]);
      setInterval(() => { loadControlLogs(); loadEvents(); }, 30000);
    }

    init();
  </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"4edd5f8ec12a48cfa682ab8261b80a79","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
