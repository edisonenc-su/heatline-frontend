<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>제어 로그 - HEAT-LINE 통합관제</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== HEAT-LINE v2 Theme (scoped, body.v2-theme 전용) ===== */
    body.v2-theme {
      --v2-bg:#0A1120; --v2-bg-2:#111B2E; --v2-panel:#1F2B41; --v2-panel-2:#1A2235;
      --v2-border:#2A3650; --v2-text:#EEF2F8; --v2-text-dim:#C5CDDB; --v2-text-mute:#96A2B8;
      --v2-amber:#F3A73B; --v2-amber-ink:#1A1200; --v2-mint:#5BD3A6; --v2-red:#F07070;
      --bg:var(--v2-bg); --bg-dark:var(--v2-bg); --bg-secondary:var(--v2-bg-2);
      --bg-card:var(--v2-panel); --panel:var(--v2-panel); --card:var(--v2-panel); --card-bg:var(--v2-panel);
      --border:var(--v2-border); --text:var(--v2-text); --text-primary:var(--v2-text);
      --text-secondary:var(--v2-text-dim); --text-muted:var(--v2-text-mute);
      --accent:var(--v2-amber); --primary:var(--v2-amber);
      background:var(--v2-bg); color:var(--v2-text);
      font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body.v2-theme .app-layout, body.v2-theme .main-content, body.v2-theme .page-body {
      background:var(--v2-bg); color:var(--v2-text);
    }
    body.v2-theme .sidebar { background:var(--v2-bg-2); border-right:1px solid var(--v2-border); color:var(--v2-text-dim); }
    body.v2-theme .sidebar a, body.v2-theme .sidebar .nav-item { color:var(--v2-text-dim); }
    body.v2-theme .sidebar a:hover, body.v2-theme .sidebar .nav-item:hover, body.v2-theme .sidebar .nav-item.active {
      background:var(--v2-panel); color:var(--v2-amber);
    }
    body.v2-theme .app-header, body.v2-theme .header { background:var(--v2-bg-2); border-bottom:1px solid var(--v2-border); color:var(--v2-text); }
    body.v2-theme .table-section, body.v2-theme .stat-card, body.v2-theme .filter-toolbar {
      background:var(--v2-panel); border:1px solid var(--v2-border); border-radius:14px;
      color:var(--v2-text); box-shadow:0 6px 24px rgba(0,0,0,0.25);
    }
    body.v2-theme .table-header h2, body.v2-theme h1, body.v2-theme h2, body.v2-theme h3 { color:var(--v2-text); }
    body.v2-theme .table-header a { color:var(--v2-mint) !important; }
    body.v2-theme thead th { background:var(--v2-panel-2); color:var(--v2-text-mute); border-bottom:1px solid var(--v2-border); font-size:12px; letter-spacing:0.04em; }
    body.v2-theme tbody td { border-bottom:1px solid var(--v2-border); color:var(--v2-text-dim); }
    body.v2-theme tbody tr:hover { background:rgba(91,211,166,0.04); }
    body.v2-theme .log-item { border-bottom:1px solid var(--v2-border); color:var(--v2-text); }
    body.v2-theme .log-item:hover { background:rgba(91,211,166,0.05); }
    body.v2-theme .log-item .log-msg { color:var(--v2-text); }
    body.v2-theme .log-item .log-meta { color:var(--v2-text-mute); }
    body.v2-theme .form-label { display:block; font-size:13px; color:var(--v2-text-mute); margin-bottom:6px; font-weight:600; }
    body.v2-theme .form-input, body.v2-theme .form-select, body.v2-theme .form-textarea,
    body.v2-theme .form-control {
      width:100%; background:var(--v2-bg); border:1px solid var(--v2-border); color:var(--v2-text);
      border-radius:10px; padding:10px 12px; outline:none; font-size:14px;
    }
    body.v2-theme .form-input:focus, body.v2-theme .form-select:focus, body.v2-theme .form-textarea:focus,
    body.v2-theme .form-control:focus {
      border-color:var(--v2-amber); box-shadow:0 0 0 3px rgba(243,167,59,0.12);
    }
    body.v2-theme .search-box input {
      background:var(--v2-bg); border:1px solid var(--v2-border); color:var(--v2-text);
      border-radius:8px; padding:8px 10px; outline:none;
    }
    body.v2-theme .search-box input::placeholder { color:var(--v2-text-mute); }
    body.v2-theme .search-box input:focus { border-color:var(--v2-amber); }
    body.v2-theme .btn-primary { background:var(--v2-amber); color:var(--v2-amber-ink); border:none; font-weight:700; }
    body.v2-theme .btn-primary:hover { filter:brightness(1.08); }
    body.v2-theme .btn-secondary { background:var(--v2-panel-2); color:var(--v2-text-dim); border:1px solid var(--v2-border); }
    body.v2-theme .btn-secondary:hover { border-color:var(--v2-amber); color:var(--v2-amber); }
    body.v2-theme .btn-danger { background:var(--v2-red); color:#1A0A0A; border:none; font-weight:700; }
    body.v2-theme .btn-warning { background:var(--v2-amber); color:var(--v2-amber-ink); border:none; font-weight:700; }
    body.v2-theme .btn-success { background:var(--v2-mint); color:#0A1A14; border:none; font-weight:700; }
    body.v2-theme .badge { border-radius:999px; }
    body.v2-theme .badge-online { background:rgba(91,211,166,0.14); color:var(--v2-mint); border:1px solid rgba(91,211,166,0.35); }
    body.v2-theme .badge-warning { background:rgba(243,167,59,0.14); color:var(--v2-amber); border:1px solid rgba(243,167,59,0.4); }
    body.v2-theme .badge-danger { background:rgba(240,112,112,0.14); color:var(--v2-red); border:1px solid rgba(240,112,112,0.4); }
    body.v2-theme .badge-offline { background:rgba(150,162,184,0.12); color:var(--v2-text-mute); border:1px solid rgba(150,162,184,0.3); }
    body.v2-theme .modal-backdrop { background:rgba(10,17,32,0.72); }
    body.v2-theme .modal-box { background:var(--v2-panel); border:1px solid var(--v2-border); color:var(--v2-text); border-radius:14px; box-shadow:0 16px 48px rgba(0,0,0,0.4); }
    body.v2-theme .modal-header { border-bottom:1px solid var(--v2-border); }
    body.v2-theme .modal-title { color:var(--v2-text); }
    body.v2-theme .modal-close { color:var(--v2-text-mute); }
    body.v2-theme .confirm-modal { color:var(--v2-text-dim); }
    body.v2-theme .modal-footer { border-top:1px solid var(--v2-border); }
    body.v2-theme a { color:var(--v2-mint); }
    body.v2-theme code { color:var(--v2-mint); }
    body.v2-theme ::-webkit-scrollbar { width:10px; height:10px; }
    body.v2-theme ::-webkit-scrollbar-thumb { background:var(--v2-border); border-radius:8px; }
    body.v2-theme ::-webkit-scrollbar-track { background:var(--v2-bg); }
  </style>

</head>
<body class="v2-theme">
  <div id="sidebar-placeholder"></div>

  <div class="app-layout">
    <div class="main-content">
      <div id="header-placeholder"></div>

      <div class="page-body">
        <div class="table-section has-mobile-list" style="margin-bottom:24px">
          <div class="table-header">
            <h2>📜 제어 로그</h2>
            <button class="btn btn-secondary btn-sm" onclick="loadAll()">🔄 새로고침</button>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>제어기명</th>
                  <th id="th-customer">고객사</th>
                  <th>명령</th>
                  <th>실행자</th>
                  <th>결과</th>
                  <th>비고</th>
                  <th>시간</th>
                </tr>
              </thead>
              <tbody id="log-tbody">
                <tr><td colspan="7" style="text-align:center;padding:40px;color:#64748b">로딩 중...</td></tr>
              </tbody>
            </table>
          </div>
          <div id="log-mobile-list" class="mobile-record-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    let session, allControllers = [], allCustomers = [];

    const cmdIcons = {
      HEATER_ON: '🔥', HEATER_OFF: '❄️',
      AUTO_MODE: '⚙️', MANUAL_MODE: '🖱️',
      REBOOT: '🔄', THRESHOLD_CHANGE: '🎯'
    };

    const cmdLabels = {
      HEATER_ON: '히터 ON', HEATER_OFF: '히터 OFF',
      AUTO_MODE: '자동 모드', MANUAL_MODE: '수동 모드',
      REBOOT: '재부팅', THRESHOLD_CHANGE: '임계값 변경'
    };

    async function init() {
      session = Auth.requireAuth();
      if (!session) return;

      document.getElementById('sidebar-placeholder').innerHTML = renderSidebar(session, 'logs');
      document.getElementById('header-placeholder').innerHTML = renderHeader('제어 로그', '', []);
      startClock();

      if (session.role !== 'admin') {
        document.getElementById('th-customer').style.display = 'none';
      }

      await loadAll();
    }

    async function loadAll() {
      [allControllers, allCustomers] = await Promise.all([
        API.getControllers(session),
        API.getCustomers()
      ]);

      const ctrlMap = {};
      allControllers.forEach(c => ctrlMap[c.id] = c);
      const custMap = {};
      allCustomers.forEach(c => custMap[c.id] = c);

      await renderLogs(ctrlMap, custMap);
    }

    function renderLogsMobile(logs, ctrlMap, custMap, isAdmin) {
      const container = document.getElementById('log-mobile-list');
      if (!container) return;
      if (!logs.length) {
        container.innerHTML = `<div class="mobile-record-card"><div class="mobile-record-card__title">제어 로그 없음</div><div class="mobile-record-card__sub">최근 제어 로그가 없습니다.</div></div>`;
        return;
      }
      container.innerHTML = logs.map(log => {
        const ctrl = ctrlMap[log.controller_id];
        const cust = ctrl ? custMap[ctrl.customer_id] : null;
        return `
          <div class="mobile-record-card" onclick="location.href='detail.html?id=${log.controller_id}'">
            <div class="mobile-record-card__top">
              <div>
                <div class="mobile-record-card__title">${cmdIcons[log.command_type] || '📌'} ${cmdLabels[log.command_type] || log.command_type}</div>
                <div class="mobile-record-card__sub">${ctrl ? ctrl.controller_name : log.controller_id}${isAdmin && cust ? ` · ${cust.company_name}` : ''}</div>
              </div>
              <span class="badge ${log.result === 'success' ? 'badge-online' : 'badge-danger'}">${log.result === 'success' ? '성공' : '실패'}</span>
            </div>
            <div class="mobile-record-grid">
              <div class="mobile-record-item"><div class="label">실행자</div><div class="value">${log.user_name || '-'}</div></div>
              <div class="mobile-record-item"><div class="label">시간</div><div class="value">${Utils.timeAgo(log.updated_at || log.created_at)}</div></div>
            </div>
            <div class="mobile-record-card__sub" style="margin-top:12px">${log.note || '-'}</div>
          </div>
        `;
      }).join('');
    }

    async function renderLogs(ctrlMap, custMap) {
      const logs = await API.getControlLogs(null, 50);
      const tbody = document.getElementById('log-tbody');
      const isAdmin = session.role === 'admin';

      const filtered = isAdmin
        ? logs
        : logs.filter(l => {
          const c = ctrlMap[l.controller_id];
          return c && c.customer_id === session.customerId;
        });

      renderLogsMobile(filtered, ctrlMap, custMap, isAdmin);

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${isAdmin ? 7 : 6}" style="text-align:center;padding:30px;color:#64748b">제어 로그 없음</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(log => {
        const ctrl = ctrlMap[log.controller_id];
        const cust = ctrl ? custMap[ctrl.customer_id] : null;
        return `
          <tr onclick="location.href='detail.html?id=${log.controller_id}'" style="cursor:pointer">
            <td>
              <div style="font-weight:600">${ctrl ? ctrl.controller_name : log.controller_id}</div>
            </td>
            ${isAdmin ? `<td style="font-size:13px;color:#94a3b8">${cust ? cust.company_name : '-'}</td>` : ''}
            <td>
              <span style="display:inline-flex;align-items:center;gap:5px;font-weight:600">
                ${cmdIcons[log.command_type] || '📌'}
                ${cmdLabels[log.command_type] || log.command_type}
              </span>
              ${log.command_value && log.command_type === 'THRESHOLD_CHANGE'
                ? `<span style="font-size:12px;color:#94a3b8"> → ${(parseFloat(log.command_value)*100).toFixed(0)}%</span>`
                : ''}
            </td>
            <td style="font-size:13px">👤 ${log.user_name || '-'}</td>
            <td>
              <span class="badge ${log.result === 'success' ? 'badge-online' : 'badge-danger'}">
                ${log.result === 'success' ? '✅ 성공' : '❌ 실패'}
              </span>
            </td>
            <td style="font-size:12px;color:#94a3b8">${log.note || '-'}</td>
            <td style="font-size:12px;color:#64748b;white-space:nowrap">${Utils.timeAgo(log.updated_at || log.created_at)}</td>
          </tr>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
